project: DefectTwin2D_Q1_Strengthening
version: 1.0.0
seeds: [20260715, 20260716, 20260717, 20260718, 20260719]
thresholds_muB: [0.05, 0.10, 0.20, 0.50]
model:
  n_estimators: 220
  min_samples_leaf: 2
  max_features: sqrt
  class_weight: balanced
  n_jobs: -1
calibration:
  inner_group_splits: 3
  ece_bins: 15
  selection_order: [Brier, log_loss, ECE]
applicability_domain:
  pca_variance: 0.95
  max_components: 25
  knn_k: 5
  development_cutoff_quantile: 0.95
statistics:
  host_bootstrap_replicates: 5000
  permutation_repeats: 10
outputs:
  formats: [csv, json, tex, png, pdf, svg]

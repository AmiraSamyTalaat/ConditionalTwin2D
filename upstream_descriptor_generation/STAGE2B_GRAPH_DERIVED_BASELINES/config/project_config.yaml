project_code: DEFECTTWIN_2D_Q1
stage: STAGE2B_GRAPH_DERIVED_BASELINE_COMPARISON
stage_version: 2.1.0
output_dir: stage2b_output
random_seed: 20260715

input:
  stage2a_fix1_zip: inputs/STAGE2A_FIX1_RESULTS.zip

graph:
  covalent_radius_scale: 1.25
  minimum_neighbor_cutoff_A: 1.1
  maximum_neighbor_cutoff_A: 3.5
  periodic_xy_translations:
    - -1
    - 0
    - 1
  radial_histogram_edges_A:
    - 0.0
    - 1.5
    - 2.0
    - 2.5
    - 3.0
    - 3.5
    - 4.5
    - 6.0
  degree_histogram_max: 8

evaluation:
  protocol: leave_one_host_out
  random_forest_trees: 120
  random_forest_min_samples_leaf: 2
  use_inverse_host_frequency_weights: true
  feature_sets:
    - metadata_only
    - defect_composition
    - defect_graph
    - pristine_graph
    - concatenated_graph
    - twin_difference_graph

gates:
  minimum_binary_auroc: 0.65
  minimum_ordinal_qwk: 0.30
  minimum_binary_gain_over_metadata_green: 0.02
  minimum_ordinal_gain_over_metadata_green: 0.05
  maximum_allowed_metric_drop_yellow: 0.02

packaging:
  fixed_zip_datetime: [2026, 7, 15, 9, 0, 0]
